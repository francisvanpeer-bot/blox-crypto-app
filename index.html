<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLOX Top 50 Crypto Score</title>
    <link rel="stylesheet" href="/src/style.css">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div>
                <h1>BLOX Top 50 Crypto & Score</h1>
                <p class="subtitle">Gesorteerd op berekende score, met koerslijn (24u).</p>
            </div>
            <div class="controls">
                <button id="currency-btn" class="currency-toggle">Valuta: € (EUR)</button>
            </div>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Naam</th>
                        <th id="th-prijs">Prijs (€)</th>
                        <th>Stijging (1u)</th>
                        <th>Stijging (24u)</th>
                        <th>Koers (24u)</th>
                        <th>Volume</th>
                        <th>Market Cap</th>
                        <th>Score (0-100)</th>
                    </tr>
                </thead>
                <tbody id="crypto-tabel-body">
                    <tr>
                        <td colspan="9" class="loading">BLOX top 50 inladen...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
